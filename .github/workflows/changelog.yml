name: Update Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit when the changelog moved
        run: |
          # Stage first: on the very first run CHANGELOG.md is untracked, and
          # `git diff` alone would report it as unchanged and never commit it.
          git add CHANGELOG.md
          if git diff --cached --quiet -- CHANGELOG.md; then
            echo "No changes to CHANGELOG.md"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update CHANGELOG.md [skip ci]"
          git push origin main
          echo "CHANGELOG.md updated and pushed"
