name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Work out the next version and release notes without tagging or publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate manifests, skills, and agents
        run: python3 .github/scripts/validate_plugin.py

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Mint a token for the release app
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Write the changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --bump
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Write the release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --bump --unreleased --strip all
        env:
          OUTPUT: ${{ runner.temp }}/RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Resolve the version to release
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ steps.changelog.outputs.version }}"
          VERSION="${VERSION#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to release: computed version '$VERSION' is not semver."
            exit 1
          fi

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists — there is nothing new to release."
            exit 1
          fi

          if ! [ -s "$RUNNER_TEMP/RELEASE_NOTES.md" ]; then
            echo "::error::Release notes came out empty for v$VERSION."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=v${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Bump the version in the manifests
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for f in .claude-plugin/marketplace.json plugins/willskills/.claude-plugin/plugin.json; do
            tmp="$(mktemp)"
            jq --arg v "$VERSION" '.version = $v' "$f" > "$tmp"
            mv "$tmp" "$f"
          done
          git --no-pager diff --stat

      - name: Stop here on a dry run
        if: inputs.dry_run
        run: |
          echo "::notice::Dry run — would have released ${{ steps.version.outputs.tag }}. Nothing was tagged or published."

      - name: Commit, tag, and move the major tag
        if: ${{ !inputs.dry_run }}
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          MAJOR="${{ steps.version.outputs.major }}"

          BOT_ID="$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq .id)"
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$BOT_ID+$APP_SLUG[bot]@users.noreply.github.com"

          git add CHANGELOG.md .claude-plugin/marketplace.json \
            plugins/willskills/.claude-plugin/plugin.json
          git commit -m "chore(release): $TAG [skip ci]"
          git tag -a "$TAG" -m "Release $TAG"
          git tag -f -a "$MAJOR" -m "Latest $MAJOR release"

          git push origin main
          git push origin "$TAG"
          git push origin "$MAJOR" --force

      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"
